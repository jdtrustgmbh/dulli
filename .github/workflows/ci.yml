name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run verify
      - run: npm run test:all

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the two-container setup
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
          docker compose up -d --build
      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"mode":"postgres"'; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
