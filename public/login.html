<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00A6A9"><title>Dulli · Anmelden</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/favicon-auto.svg"><link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png"><link rel="apple-touch-icon" sizes="167x167" href="/assets/brand/apple-touch-icon-167.png"><link rel="apple-touch-icon" sizes="152x152" href="/assets/brand/apple-touch-icon-152.png"><link rel="apple-touch-icon" sizes="120x120" href="/assets/brand/apple-touch-icon-120.png"><meta name="apple-mobile-web-app-title" content="Dulli"><script>(function(){var d=document.documentElement,k='jd-theme';function g(){try{return localStorage.getItem(k)==='dark'?'dark':'light'}catch(e){return 'light'}}function a(){var t=g();if(t==='dark')d.setAttribute('data-theme','dark');else d.removeAttribute('data-theme');if(t==='dark'&&!document.getElementById('jd-dark-pre')){var s=document.createElement('style');s.id='jd-dark-pre';s.textContent='html[data-theme=dark],html[data-theme=dark] body{background:#0b1622;color-scheme:dark}';document.head.appendChild(s)}var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0b1622':'#00A6A9')}window.jdTheme={get:g,apply:a,set:function(t){try{if(t==='dark')localStorage.setItem(k,'dark');else localStorage.removeItem(k)}catch(e){}a()}};a()})()</script><link rel="stylesheet" href="/css/brand.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/features/theme-extras.css"><link rel="stylesheet" href="/css/controls.css"><link rel="stylesheet" href="/css/dark.css"><style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:var(--space-5)}.login-card{width:100%;max-width:360px;padding:var(--space-6);border-radius:var(--radius-xl)}.login-card h1{font-size:var(--text-xl);margin-bottom:var(--space-1)}.login-card .muted{margin-bottom:var(--space-5)}.login-card label{display:block;font-size:var(--text-md);font-weight:700;margin:var(--space-4) 0 var(--space-2)}.login-card input{width:100%;border:1px solid var(--line);border-radius:var(--radius-md);padding:13px;font:inherit}.login-error{color:var(--coral);font-size:var(--text-sm);margin-top:var(--space-3);min-height:1.2em}.login-card button{margin-top:var(--space-5)}
</style><script src="/js/public-i18n.js"></script></head><body class="jd-login"><main class="login-shell"><form class="card login-card" id="login-form"><a class="brand" href="/" aria-label="Dulli" style="margin-bottom:20px"><img class="brand-logo brand-logo--stacked" src="/assets/brand/dulli-logo-stacked-light.svg" alt="" width="150" height="138"><img class="brand-logo brand-logo--dark brand-logo--stacked" src="/assets/brand/dulli-logo-stacked-dark-transparent.svg" alt="" width="150" height="138"></a><h1>Anmelden</h1><p class="muted">Melde dich an, um dein Dashboard zu sehen.</p><label for="login-email">E-Mail</label><input id="login-email" name="email" type="email" required autocomplete="username"><label for="login-password">Passwort</label><input id="login-password" name="password" type="password" required autocomplete="current-password"><p class="login-error" id="login-error" role="alert"></p><button class="primary-button" type="submit">Anmelden</button></form></main><script>
document.querySelector('#login-form').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.querySelector('#login-error');
  error.textContent = '';
  const email = document.querySelector('#login-email').value.trim();
  const password = document.querySelector('#login-password').value;
  try {
    const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    if (!response.ok) { error.textContent = window.jdPT('E-Mail oder Passwort ist falsch.'); return; }
    window.location.href = '/app';
  } catch { error.textContent = window.jdPT('Anmeldung gerade nicht möglich. Erneut versuchen.'); }
});
</script></body></html>
