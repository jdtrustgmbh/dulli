</style><script src="/js/public-i18n.js"></script></head><body class="jd-login"><main class="login-shell"><form class="card login-card" id="join-form"><a class="brand" href="/" aria-label="Dulli" style="margin-bottom:20px"><img class="brand-logo brand-logo--stacked" src="/assets/brand/dulli-logo-stacked-light.svg" alt="" width="150" height="138"><img class="brand-logo brand-logo--dark brand-logo--stacked" src="/assets/brand/dulli-logo-stacked-dark-transparent.svg" alt="" width="150" height="138"></a><h1>Einladung annehmen</h1><p class="muted">Lege dein Konto an, um den gemeinsamen Haushalt zu nutzen.</p><label for="join-code">Einladungscode</label><input id="join-code" name="code" required autocomplete="off" spellcheck="false"><label for="join-email">E-Mail</label><input id="join-email" name="email" type="email" required autocomplete="username"><label for="join-password">Passwort (mindestens 8 Zeichen)</label><input id="join-password" name="password" type="password" required minlength="8" autocomplete="new-password"><p class="login-error" id="join-error" role="alert"></p><button class="primary-button" type="submit">Konto anlegen</button><p class="muted" style="margin-top:16px"><a href="/login">Schon ein Konto? Anmelden</a></p></form></main><script>
const params = new URLSearchParams(location.search);
if (params.get('code')) document.querySelector('#join-code').value = params.get('code');
const messages = { invalid_or_expired_invite: 'Der Einladungscode ist ungültig oder abgelaufen.', invite_for_other_email: 'Diese Einladung gilt für eine andere E-Mail-Adresse.', email_taken: 'Für diese E-Mail gibt es schon ein Konto.', invalid_email: 'Bitte eine gültige E-Mail-Adresse eingeben.', password_too_short: 'Das Passwort braucht mindestens 8 Zeichen.', too_many_attempts: 'Zu viele Versuche. Bitte später erneut versuchen.' };
document.querySelector('#join-form').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.querySelector('#join-error'); error.textContent = '';
  const body = { code: document.querySelector('#join-code').value.trim(), email: document.querySelector('#join-email').value.trim(), password: document.querySelector('#join-password').value };
  try {
    const response = await fetch('/api/auth/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!response.ok) { const data = await response.json().catch(() => ({})); error.textContent = window.jdPT(messages[data.error] ?? 'Das hat nicht geklappt. Erneut versuchen.'); return; }
    window.location.href = '/app';
  } catch { error.textContent = window.jdPT('Gerade nicht möglich. Erneut versuchen.'); }
});
</script></body></html>
